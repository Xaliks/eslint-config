name: Publish Package to npmjs
on:
  release:
    types: [published]
  workflow_dispatch: # Позволяет запускать вручную из браузера

# Добавляем необходимые права для генерации provenance и чтения репозитория
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          scope: '@xaliksss'

      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
